<text x="609.4" y="188.0" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#5B6670">n=33,103</text>
<text x="198" y="238.0" text-anchor="end" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#5B6670">Good</text>
