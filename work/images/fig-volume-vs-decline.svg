<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Decline rate falls as traffic rises: low 0.342, moderate 0.299, good 0.226, excellent 0.204.">
<title>Decline rate falls as traffic rises: low 0.342, moderate 0.299, good 0.226, excellent 0.204.</title>
<rect width="760" height="400" fill="#FBFAF7"/>
<text x="32" y="44" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="600" letter-spacing="-0.3" fill="#14161A">The assumption ran backwards</text>
<text x="32" y="66" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#5B6670">Observed decline rate by prior-30-day impressions · all 120,507 pages</text>
<text x="198" y="138.0" text-anchor="end" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#5B6670">Low</text>
