<text x="503.5" y="288.0" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#5B6670">n=14,908</text>
<line x1="214" y1="108" x2="214" y2="308" stroke="#E3E0D9" stroke-width="1"/>
<text x="214" y="338" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#A8461F" font-weight="600">Higher traffic → lower decline rate, monotonically.</text>
<line x1="32" y1="358" x2="728" y2="358" stroke="#E3E0D9" stroke-width="1"/>
<text x="32" y="378" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#5B6670">The 'visible' half of the refresh rule selects the pages least likely to be at risk.</text>
