<text x="478.0" y="238.0" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#14161A">0.226</text>
<text x="528.0" y="238.0" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#5B6670">n=33,175</text>
